<!DOCTYPE html>
<html>
    <head> 
        <title>ArtImages</title>
        <link rel="icon" type="image/png" href="artimg/apic23.png">
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="styles2.css" />
        <script type='module' src="script.js" defer></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
    </head>
    <body class="body2">
        <canvas id="particles" aria-hidden="true"></canvas>
        <div class="nav-bar2">
            <p class="boldtext2">ART</p>
            <p class="wtxt grd-el">Images</p>
        </div>
        <div class="image-box2" id="image_box2">
            <img id='image2' src="sigma.png">
        </div>
        <p class="p8 ples2" id="lnum2">Year</p>
        <div class="property-box2">
            <p class="p1 pb2" id="p4">Click</p>
            <p class="p2 pb2" id="p5">The</p>
            <p class="p4 pb2" id="p6">Image</p>
            <p class="p5 pb2" id="p7">To</p>
            <p class="p6 pb2" id="p8">Start</p>
        </div>
        <dialog class="adial1">
            <h1 class="boldtext2 info2">i</h1>
            <p class="ww">Click The Image to move on, Hover over the feilds to reveal information about the picture</p>
            <p class="ww">Flag an Image by clicking the '🏳️' at the bottom and select the 'Flagged' Filter to Single them out!</p>
            <button class="conbtn">Got It!</button>
        </dialog>
        <div class="filterblock2 pos3">
            <button class="filtbutton" id="all2">ALL</button>
            <button class="filtbutton" id="paint">Paintings</button>
            <button class="filtbutton" id="statu">Statues</button>
            <button class="filtbutton" id="buildi">Buildings</button>
            <button class="filtbutton" id="bstat">Budu Pilima</button>
            <button class="filtbutton" id="kat">Katayam</button>
            <button class="filtbutton" id="mutr">Murthi</button>
            <button class="filtbutton" id="fxx">Flagged</button>
        </div>
        <button class="xbtn" id="xx">🏳️</button>
        <p style="font-family: montserrat; color:rgba(255,255,255,0.5); text-align: right;">© DamDam 2026</p>
        <svg aria-hidden="true" width="0" height="0" style="position: absolute;">
            <defs>
                <filter id="displacementFilter" x="-20%" y="-20%" width="140%" height="140%">
                    <feTurbulence
                        type="fractalNoise"
                        baseFrequency="0.015 0.02"
                        numOctaves="2"
                        seed="3"
                        result="noise"
                    />
                    <feDisplacementMap
                        in="SourceGraphic"
                        in2="noise"
                        scale="24"
                        xChannelSelector="R"
                        yChannelSelector="G"
                    />
                </filter>
            </defs>
        </svg>
        <template>
            <div class="card">
                <slot></slot>
            </div>
        </template>
    </body>
</html>
